########## MAIN HYPRLAND CONFIG ##########

# Source modular configs
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/style.conf
source = ~/.config/hypr/wallust/wallust-hyprland.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspace-rules.conf
source = ~/.config/hypr/autostart.conf


# General settings
general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    layout = dwindle
}


scrolling {
    fullscreen_on_one_column = true   # single column fills the whole screen
    column_width = 0.7                # default column takes 50% of screen width
    focus_fit_method = 1              # 0 = center focused col, 1 = fit into view
    follow_focus = true               # auto-scroll when a window is focused
    follow_min_visible = 0.4          # must be at least 40% visible to auto-follow
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0  # cycle widths with colresize
    direction = right                 # new windows appear to the right
}

animations {
    enabled = true

    # Bezier curves
    bezier = overshoot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.16, 1.0, 0.2, 1.0
    bezier = smoothIn, 0.1, 0.0, 0.2, 1.0

    # Window animations
    animation = windows, 1, 5, overshoot, popin 80%
    animation = windowsIn, 1, 5, smoothOut, popin 80%
    animation = windowsOut, 1, 5, smoothIn, popin 80%

    # Workspace animation
    animation = workspaces, 1, 4, smoothOut

    # Fade animations
    animation = fade, 1, 6, smoothOut
    animation = fadeIn, 1, 6, smoothOut
    animation = fadeOut, 1, 5, smoothIn

    # Window move animation (FIXED)
    animation = windowsMove, 1, 4, smoothOut
}

