$iDIR = $HOME/.config/swaync/images/ja.png

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
}

# Dim backlight instead of powering monitor off (no NVIDIA DPMS re-init = no wake crash)
listener {
    timeout = 270
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 540
    on-timeout = notify-send -i $iDIR "You are idle!"
    on-resume = notify-send -i $iDIR "Oh! you're Back" "Hello !!!"
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

